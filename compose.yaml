name: mvp

services:
  mysql:
    image: mysql:8.0
    container_name: mvp_shujuku
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "030206"
      MYSQL_DATABASE: "mvp"
      TZ: "Asia/Shanghai"

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
